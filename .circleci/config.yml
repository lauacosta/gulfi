version: 2.1

orbs:
  shadesmar: shadesmar/rust@1.2.0
  node: circleci/node@7.1.0

workflows:
  version: 2

  build_and_test:
    jobs:
      - check:
          context: [aws]

      - test:
          context: [aws]

      - coverage_report:
          context: [aws]

      - dependency_analysis:
          context: [aws]
          requires:
            - check

      - build_ui:
          context: []

      - update_taiga:
          context: [aws, taiga, slack]
          requires:
            - check
            - test
            - dependency_analysis
  
      - hold_for_approval:
          type: approval
          requires:
            - update_taiga
            - build_ui
          filters:
            branches:
              only: main

      # - deploy_to_vps:
      #     context: [aquiles, slack, aws]
      #     requires:
      #       - hold_for_approval
      #     filters:
      #       branches:
      #         only: main

jobs:
  check:
    executor: shadesmar/rust
    steps:
      - checkout
      - shadesmar/with_rust:
          steps:
            - run: |
                just check_report
            - persist_to_workspace:
                root: /root/project
                paths:
                  - clippy.json


  test:
    executor: shadesmar/rust
    steps:
      - checkout
      - shadesmar/with_rust:
          steps:
            - run: |
                just test
            - run: |
                mv /root/project/target/nextest/ci/junit.xml /root/project/

            - store_test_results:
                path: junit.xml

            - persist_to_workspace:
                root: /root/project
                paths:
                  - junit.xml


  coverage_report:
    executor: shadesmar/rust
    steps:
      - checkout
      - shadesmar/with_rust:
          steps:
            - run: |
                just coverage

            - persist_to_workspace:
                root: /root/project
                paths:
                  - lcov.info


  dependency_analysis:
    executor: shadesmar/rust
    steps:
      - checkout
      - attach_workspace:
          at: /root/project
      - shadesmar/with_rust:
          steps:
            - run: |
                  echo "Running unused dependencies check..."
                  just udeps_report || true
                  
                  echo "Running license and dependency denial check..."
                  just deny_report || true
                   
                  echo "Running security audit..."
                  just audit_report || true

                  echo "Preparing sonar analysis..."
                  just sonar

            - persist_to_workspace:
                root: /root/project
                paths:
                  - sonar-issues.json
                  - udeps.json
                  - clippy.json
                  - audit.json
                  - deny.json
                
  build_ui:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - node/install:
          install-pnpm: true

      - run:
          name: building-ui
          command: cd crates/gulfi-server/ui/ && pnpm install && pnpm build

      - persist_to_workspace:     
          root: .
          paths:
            - crates/gulfi-server/ui/dist

  update_taiga:
    executor: shadesmar/rust
    steps:
      - checkout
      - shadesmar/update_taiga:
          project_name: Gulfi
          
